backend:
  name: github
  repo: ayixiayi/ayixiayi.github.io
  branch: main
  base_url: https://decap-oauth.ayixiayi.workers.dev
  auth_endpoint: /auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "zh_Hans"

collections:
  - name: "blog"
    label: "博客文章"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "描述", name: "description", widget: "text" }
      - { label: "发布日期", name: "pubDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - { label: "网址", name: "slug", widget: "string", required: false, hint: "可选。文章的短网址，例如 tool-paradox 对应 /blog/tool-paradox/；只用小写字母、数字和连字符。留空则使用文件名。发布后不要再改，否则旧链接会失效。", pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "只能包含小写字母、数字和连字符"] }
      - { label: "标签", name: "tags", widget: "list", default: [], allow_add: true, hint: "每个标签单独一项，不需要加 #。" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "正文", name: "body", widget: "markdown" }
